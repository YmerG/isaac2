<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Isaac 2 — test entre amis</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#140d0a;color:#f3e6d0;font-family:system-ui,sans-serif;text-align:center}
.c{max-width:420px;padding:24px}img{width:220px;image-rendering:pixelated;border-radius:12px}
h1{font-size:2.4em;margin:.3em 0;letter-spacing:2px;color:#ffb347}p{opacity:.8}
input{font-size:1.4em;padding:10px;width:140px;text-align:center;border-radius:10px;border:2px solid #ffb347;background:#2a1a12;color:#fff}
button{font-size:1.3em;padding:12px 28px;margin-top:14px;border:0;border-radius:12px;background:#ffb347;color:#140d0a;font-weight:700;cursor:pointer}
#e{color:#ff6b6b;height:1.2em}
</style></head><body><div class="c">
<img src="cover.png" alt=""><h1>ISAAC 2</h1><p>Version de test privée. Entre le code pour jouer.</p>
<form onsubmit="go();return false"><input id="k" type="password" inputmode="numeric" placeholder="code" autofocus><br><button>▶ Jouer</button></form>
<p id="e"></p><p style="font-size:.85em">Paysage conseillé sur téléphone. Le jeu passe en plein écran au premier toucher (bouton ⛶ en haut à droite). Sur iPhone : Partager → « Sur l’écran d’accueil ».</p></div>
<script>function go(){if(document.getElementById('k').value==='1234'){sessionStorage.ok=1;location.href='jeu/'}else document.getElementById('e').textContent='Mauvais code'}</script>
</body></html>
